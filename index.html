<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SP624E Service Scanner</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #38bdf8; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 400px; background: var(--card); padding: 1.5rem; border-radius: 1.5rem; text-align: center; }
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background: #10b981; color: white; margin-bottom: 10px; }
        #debugLog { 
            width: 100%; max-width: 400px; height: 250px; background: #000; color: #00ff00; 
            font-family: monospace; font-size: 11px; padding: 10px; margin-top: 20px; 
            border-radius: 8px; overflow-y: auto; border: 1px solid #334155; text-align: left;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>UUID Scanner</h1>
    <p style="font-size: 0.8rem; opacity: 0.7;">We need to find the correct Service UUID for your device.</p>
    <button id="scanBtn">SCAN DEVICE SERVICES</button>
</div>

<div id="debugLog">> Click Scan and select your LED device.</div>

<script>
    const log = (msg) => {
        const entry = document.createElement('div');
        entry.style.marginBottom = "5px";
        entry.innerText = `> ${msg}`;
        const container = document.getElementById('debugLog');
        container.appendChild(entry);
        container.scrollTop = container.scrollHeight;
    };

    document.getElementById('scanBtn').addEventListener('click', async () => {
        try {
            log("Requesting Device...");
            // We request all devices and many common service UUIDs just in case
            const device = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: [
                    '0000fef0-0000-1000-8000-00805f9b34fb',
                    '0000ffe0-0000-1000-8000-00805f9b34fb',
                    '0000ff01-0000-1000-8000-00805f9b34fb',
                    '00010203-0405-0607-0809-0a0b0c0d0e0f'
                ]
            });

            log(`Connected to: ${device.name}`);
            const server = await device.gatt.connect();

            log("Searching for services...");
            const services = await server.getPrimaryServices();
            
            log(`Found ${services.length} services:`);
            
            for (const service of services) {
                log(`SERVICE: ${service.uuid}`);
                // Try to find characteristics for this service
                const chars = await service.getCharacteristics();
                for (const char of chars) {
                    log(`-- CHAR: ${char.uuid}`);
                }
            }
            log("--- SCAN COMPLETE ---");
        } catch (error) {
            log(`ERROR: ${error.message}`);
        }
    });
</script>
</body>
</html>
