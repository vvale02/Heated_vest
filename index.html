<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SP624E Final Controller</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #38bdf8; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 400px; background: var(--card); padding: 1.5rem; border-radius: 1.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h1 { font-size: 1.2rem; text-align: center; color: var(--accent); margin-top: 0; }
        
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 10px; transition: 0.2s; }
        #connectBtn { background: #10b981; color: white; }
        #offBtn { background: #ef4444; color: white; }
        button:active { opacity: 0.7; transform: scale(0.98); }
        
        .slider-row { margin-bottom: 15px; }
        label { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 4px; }
        input[type=range] { width: 100%; height: 10px; border-radius: 5px; background: #334155; outline: none; -webkit-appearance: none; }
        
        /* Slider Thumb Styling */
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid white; }
        #rVal::-webkit-slider-thumb { background: #ff4444; }
        #gVal::-webkit-slider-thumb { background: #22c55e; }
        #bVal::-webkit-slider-thumb { background: #3b82f6; }
        #wVal::-webkit-slider-thumb { background: #ffffff; }

        #debugLog { 
            width: 100%; max-width: 400px; height: 100px; background: #000; color: #00ff00; 
            font-family: monospace; font-size: 10px; padding: 10px; margin-top: 20px; 
            border-radius: 8px; overflow-y: auto; border: 1px solid #334155; box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>LED Controller</h1>
    
    <button id="connectBtn">CONNECT TO LIGHTS</button>
    <button id="offBtn">TURN ALL OFF</button>

    <div class="slider-row">
        <label>Red <span id="rOut">0</span></label>
        <input type="range" id="rVal" min="0" max="255" value="0">
    </div>
    <div class="slider-row">
        <label>Green <span id="gOut">0</span></label>
        <input type="range" id="gVal" min="0" max="255" value="0">
    </div>
    <div class="slider-row">
        <label>Blue <span id="bOut">0</span></label>
        <input type="range" id="bVal" min="0" max="255" value="0">
    </div>
    <div class="slider-row">
        <label>White <span id="wOut">0</span></label>
        <input type="range" id="wVal" min="0" max="255" value="0">
    </div>
</div>

<div id="debugLog">> System Ready. Click Connect.</div>

<script>
    // Updated IDs based on your successful scan
    const SERVICE_UUID = '0000ffe0-0000-1000-8000-00805f9b34fb';
    const CHARACTERISTIC_UUID = '0000ffe1-0000-1000-8000-00805f9b34fb';

    let bleDevice, bleCharacteristic;

    const log = (msg) => {
        const entry = document.createElement('div');
        entry.innerText = `> ${msg}`;
        const container = document.getElementById('debugLog');
        container.appendChild(entry);
        container.scrollTop = container.scrollHeight;
    };

    document.getElementById('connectBtn').addEventListener('click', async () => {
        try {
            log("Opening pairing menu...");
            bleDevice = await navigator.bluetooth.requestDevice({
                filters: [{ name: 'SP624E' }],
                optionalServices: [SERVICE_UUID]
            });

            log(`Connecting to ${bleDevice.name}...`);
            const server = await bleDevice.gatt.connect();

            log("Accessing LED Service...");
            const service = await server.getPrimaryService(SERVICE_UUID);

            log("Binding to Control Switch...");
            bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

            log("READY! Move sliders to change color.");
            document.getElementById('connectBtn').innerText = "CONNECTED";
            document.getElementById('connectBtn').style.background = "#334155";
        } catch (error) {
            log(`Error: ${error.message}`);
        }
    });

    async function sendCommand(r, g, b, w) {
        if (!bleCharacteristic) return;
        
        // Command structure: Header, R, G, B, W, Speed(0), Mode(Static), Terminator
        const payload = new Uint8Array([0x31, r, g, b, w, 0x00, 0x01, 0xFF]);

        try {
            await bleCharacteristic.writeValue(payload);
        } catch (err) {
            console.warn("Write failed. Retrying...");
        }
    }

    const sliders = ['rVal', 'gVal', 'bVal', 'wVal'];
    const updateUI = () => {
        const r = document.getElementById('rVal').value;
        const g = document.getElementById('gVal').value;
        const b = document.getElementById('bVal').value;
        const w = document.getElementById('wVal').value;
        
        document.getElementById('rOut').innerText = r;
        document.getElementById('gOut').innerText = g;
        document.getElementById('bOut').innerText = b;
        document.getElementById('wOut').innerText = w;
        
        sendCommand(parseInt(r), parseInt(g), parseInt(b), parseInt(w));
    };

    sliders.forEach(id => {
        document.getElementById(id).addEventListener('input', updateUI);
    });

    document.getElementById('offBtn').onclick = () => {
        sliders.forEach(id => document.getElementById(id).value = 0);
        ['rOut', 'gOut', 'bOut', 'wOut'].forEach(id => document.getElementById(id).innerText = 0);
        sendCommand(0, 0, 0, 0);
        log("Command Sent: All Off");
    };
</script>

</body>
</html>
