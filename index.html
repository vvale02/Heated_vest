<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SP624E RGBW Controller</title>

<style>
:root {
  --bg:#0f172a; --card:#1e293b; --text:#f8fafc;
  --accent:#38bdf8; --ok:#10b981; --off:#ef4444;
}
body {
  background:var(--bg); color:var(--text);
  font-family:sans-serif; margin:0; padding:20px;
  display:flex; flex-direction:column; align-items:center;
}
.container {
  width:100%; max-width:400px; background:var(--card);
  padding:1.5rem; border-radius:1.5rem;
  box-shadow:0 10px 25px rgba(0,0,0,.35);
}
h1 { text-align:center; color:var(--accent); margin:0 0 10px; }

button {
  width:100%; padding:12px; margin-bottom:10px;
  border:none; border-radius:8px; font-weight:bold;
  cursor:pointer; transition:.15s;
}
button:active { transform:scale(.98); opacity:.8; }

#connectBtn { background:var(--ok); color:white; }
#offBtn { background:var(--off); color:white; }

.slider-row { margin-bottom:15px; }
label { display:flex; justify-content:space-between; font-size:.8rem; }
input[type=range] {
  width:100%; height:10px; border-radius:5px;
  background:#334155; -webkit-appearance:none;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance:none; width:22px; height:22px;
  border-radius:50%; border:2px solid white;
}
#rVal::-webkit-slider-thumb{background:#ff4444}
#gVal::-webkit-slider-thumb{background:#22c55e}
#bVal::-webkit-slider-thumb{background:#3b82f6}
#wVal::-webkit-slider-thumb{background:#ffffff}

#debugLog {
  width:100%; max-width:400px; height:120px;
  background:#000; color:#00ff00;
  font-family:monospace; font-size:11px;
  padding:10px; margin-top:15px;
  border-radius:8px; overflow-y:auto;
}
</style>
</head>

<body>

<div class="container">
  <h1>SP624E LED Controller</h1>

  <button id="connectBtn">CONNECT</button>
  <button id="offBtn">TURN ALL OFF</button>

  <div class="slider-row">
    <label>Red <span id="rOut">0</span></label>
    <input type="range" id="rVal" min="0" max="255">
  </div>
  <div class="slider-row">
    <label>Green <span id="gOut">0</span></label>
    <input type="range" id="gVal" min="0" max="255">
  </div>
  <div class="slider-row">
    <label>Blue <span id="bOut">0</span></label>
    <input type="range" id="bVal" min="0" max="255">
  </div>
  <div class="slider-row">
    <label>White <span id="wOut">0</span></label>
    <input type="range" id="wVal" min="0" max="255">
  </div>
</div>

<div id="debugLog">> Ready</div>

<script>
// ======================================================
// CONFIRMED WORKING UUIDs (UNCHANGED)
// ======================================================
const SERVICE_UUID = '0000ffe0-0000-1000-8000-00805f9b34fb';
const CHARACTERISTIC_UUID = '0000ffe1-0000-1000-8000-00805f9b34fb';

// ======================================================
// OPTIONAL: Channel order mapping (SceneX calibration)
// Default: R,G,B,W
// Example alternative: ['w','r','g','b']
// ======================================================
let channelOrder = ['r','g','b','w'];

// ======================================================
let device = null;
let characteristic = null;
let writeWithoutResponse = false;
let debounceTimer = null;

// ======================================================
const log = msg => {
  const box = document.getElementById('debugLog');
  box.innerHTML += `<div>> ${msg}</div>`;
  box.scrollTop = box.scrollHeight;
};

// ======================================================
function buildPayload(r,g,b,w) {
  const map = { r, g, b, w };
  const ch = channelOrder.map(c => map[c]);
  return new Uint8Array([
    0x31,        // Command header
    ch[0], ch[1], ch[2], ch[3], // RGBW
    0x00,        // Speed placeholder
    0x01,        // Static mode
    0xFF         // Terminator
  ]);
}

// ======================================================
async function writeCommand(payload) {
  if (!characteristic) return;
  try {
    if (writeWithoutResponse) {
      await characteristic.writeValueWithoutResponse(payload);
    } else {
      await characteristic.writeValue(payload);
    }
  } catch (e) {
    log('Write error: ' + e.message);
  }
}

// ======================================================
function sendDebounced(r,g,b,w) {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    const p = buildPayload(r,g,b,w);
    writeCommand(p);
  }, 150);
}

// ======================================================
document.getElementById('connectBtn').onclick = async () => {
  try {
    log('Requesting device...');
    device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices:[SERVICE_UUID]
    });

    device.addEventListener('gattserverdisconnected', () => {
      log('Disconnected');
      characteristic = null;
      document.getElementById('connectBtn').innerText = 'CONNECT';
      document.getElementById('connectBtn').style.background = 'var(--ok)';
    });

    log('Connecting...');
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

    writeWithoutResponse = characteristic.properties.writeWithoutResponse;
    log('Connected (writeWithoutResponse=' + writeWithoutResponse + ')');

    document.getElementById('connectBtn').innerText = 'CONNECTED';
    document.getElementById('connectBtn').style.background = '#334155';
  } catch (e) {
    log('Error: ' + e.message);
  }
};

// ======================================================
['rVal','gVal','bVal','wVal'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => {
    const r = +rVal.value, g = +gVal.value, b = +bVal.value, w = +wVal.value;
    rOut.textContent=r; gOut.textContent=g; bOut.textContent=b; wOut.textContent=w;
    sendDebounced(r,g,b,w);
  });
});

// ======================================================
document.getElementById('offBtn').onclick = () => {
  rVal.value=gVal.value=bVal.value=wVal.value=0;
  rOut.textContent=gOut.textContent=bOut.textContent=wOut.textContent=0;
  sendDebounced(0,0,0,0);
  log('All OFF');
};

// ======================================================
window.addEventListener('beforeunload', () => {
  if (device?.gatt?.connected) device.gatt.disconnect();
});
</script>
</body>
</html>
